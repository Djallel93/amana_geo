<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <?!= include('assets/css/styles.html'); ?>
    <style>
        body {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        h2 {
            color: #4facfe;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🔍 Trouver un quartier</h2>

        <div class="form-group">
            <label>Méthode de recherche</label>
            <div class="radio-group gap-10">
                <div class="radio-option selected" onclick="selectMethod('address')">
                    <input type="radio" name="method" value="address" checked> 📍 Adresse
                </div>
                <div class="radio-option" onclick="selectMethod('coords')">
                    <input type="radio" name="method" value="coords"> 🌐 Coordonnées
                </div>
            </div>
        </div>

        <div id="addressInput" class="form-group">
            <label for="address">Adresse</label>
            <input type="text" id="address" placeholder="Ex: 1 Place Bellecour, Lyon">
        </div>

        <div id="coordsInput" class="form-group hidden">
            <label for="lat">Latitude</label>
            <input type="number" id="lat" step="0.0001" placeholder="47.2173">

            <label for="lng" class="mt-10">Longitude</label>
            <input type="number" id="lng" step="0.0001" placeholder="-1.5536">
        </div>

        <div class="form-group">
            <label for="maxDist">Distance maximale (km)</label>
            <input type="number" id="maxDist" value="50" min="1" max="200">
        </div>

        <button class="btn-primary" style="width: 100%;" onclick="findQuartier()">🔍 Rechercher</button>

        <div id="result" class="results"></div>
    </div>

    <script>
        function selectMethod(method) {
            document.querySelectorAll('.radio-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');

            document.querySelectorAll('input[name="method"]').forEach(radio => {
                radio.checked = radio.value === method;
            });

            if (method === 'address') {
                document.getElementById('addressInput').classList.remove('hidden');
                document.getElementById('coordsInput').classList.add('hidden');
            } else {
                document.getElementById('addressInput').classList.add('hidden');
                document.getElementById('coordsInput').classList.remove('hidden');
            }
        }

        function findQuartier() {
            const method = document.querySelector('input[name="method"]:checked').value;
            const maxDist = parseFloat(document.getElementById('maxDist').value);

            if (method === 'address') {
                const address = document.getElementById('address').value;
                if (!address) {
                    alert('⚠️ Veuillez saisir une adresse');
                    return;
                }

                google.script.run
                    .withSuccessHandler(showResult)
                    .withFailureHandler(showError)
                    .findQuartierByAddressUI(address, maxDist);
            } else {
                const lat = parseFloat(document.getElementById('lat').value);
                const lng = parseFloat(document.getElementById('lng').value);

                if (!lat || !lng) {
                    alert('⚠️ Veuillez saisir les coordonnées');
                    return;
                }

                google.script.run
                    .withSuccessHandler(showResult)
                    .withFailureHandler(showError)
                    .findQuartierByCoordsUI(lat, lng, maxDist);
            }
        }

        function showResult(result) {
            const div = document.getElementById('result');
            div.classList.add('show');
            div.innerHTML =
                '<div class="result-success">' +
                '<h3 style="margin-top: 0; color: #2e7d32;">✅ Quartier trouvé</h3>' +
                '<p><strong>Nom:</strong> ' + result.quartierName + '</p>' +
                '<p><strong>Distance:</strong> ' + result.distance + ' km</p>' +
                '<p><strong>Coordonnées:</strong> ' + result.quartierLatitude + ', ' + result.quartierLongitude + '</p>' +
                '<p><strong>Secteur ID:</strong> ' + result.idSecteur + '</p>' +
                '</div>';
        }

        function showError(error) {
            const div = document.getElementById('result');
            div.classList.add('show');
            div.innerHTML =
                '<div class="result-error">' +
                '<h3 style="margin-top: 0; color: #c62828;">❌ Erreur</h3>' +
                '<p>' + error + '</p>' +
                '</div>';
        }
    </script>
</body>

</html>

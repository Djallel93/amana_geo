<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <?!= include('Google_app_script/assets/css/styles.html'); ?>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>📍 Géocoder les quartiers</h2>

        <div class="info-box info">
            ℹ️ Cette opération va géocoder les quartiers sélectionnés et mettre à jour leurs coordonnées GPS.
        </div>

        <div class="form-group">
            <label for="ville">Ville</label>
            <select id="ville" onchange="loadSecteurs()">
                <option value="">Toutes les villes</option>
            </select>
        </div>

        <div class="form-group">
            <label for="secteur">Secteur (optionnel)</label>
            <select id="secteur">
                <option value="">Tous les secteurs</option>
            </select>
        </div>

        <div class="form-group">
            <label>Options</label>
            <div class="checkbox-group">
                <input type="checkbox" id="skipExisting" checked>
                <label for="skipExisting">
                    Ignorer les quartiers déjà géocodés
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="batchSize">Taille du lot</label>
            <input type="number" id="batchSize" value="10" min="1" max="50">
            <small>Nombre de quartiers à géocoder par lot (max 50)</small>
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="google.script.host.close()">Annuler</button>
            <button class="btn-primary" onclick="geocodeQuartiers()">🚀 Démarrer</button>
        </div>

        <div class="progress" id="progress">
            <div class="spinner"></div>
            <p class="progress-text">Géocodage en cours...</p>
        </div>
    </div>

    <script>
        // Charger les villes au démarrage
        google.script.run
            .withSuccessHandler(function (villes) {
                const select = document.getElementById('ville');
                villes.forEach(function (ville) {
                    const option = document.createElement('option');
                    option.value = ville.id;
                    option.textContent = ville.nom + ' (' + ville.codePostal + ')';
                    select.appendChild(option);
                });
            })
            .getAllVilles();

        // Charger les secteurs quand une ville est sélectionnée
        function loadSecteurs() {
            const villeId = document.getElementById('ville').value;
            const secteurSelect = document.getElementById('secteur');

            secteurSelect.innerHTML = '<option value="">Tous les secteurs</option>';

            if (villeId) {
                google.script.run
                    .withSuccessHandler(function (secteurs) {
                        secteurs.forEach(function (secteur) {
                            const option = document.createElement('option');
                            option.value = secteur.id;
                            option.textContent = secteur.nom;
                            secteurSelect.appendChild(option);
                        });
                    })
                    .getSecteursByVille(villeId);
            }
        }

        // Lancer le géocodage
        function geocodeQuartiers() {
            const villeId = document.getElementById('ville').value;
            const secteurId = document.getElementById('secteur').value;
            const skipExisting = document.getElementById('skipExisting').checked;
            const batchSize = parseInt(document.getElementById('batchSize').value);

            document.getElementById('progress').classList.add('show');
            document.querySelector('.btn-primary').disabled = true;

            google.script.run
                .withSuccessHandler(function (result) {
                    alert('✅ Géocodage terminé !\n\n' +
                        'Succès: ' + result.success + '\n' +
                        'Échecs: ' + result.errors + '\n' +
                        'Total: ' + result.total);
                    google.script.host.close();
                })
                .withFailureHandler(function (error) {
                    alert('❌ Erreur: ' + error);
                    document.getElementById('progress').classList.remove('show');
                    document.querySelector('.btn-primary').disabled = false;
                })
                .geocodeQuartiersUI(villeId, secteurId, skipExisting, batchSize);
        }
    </script>
</body>

</html>

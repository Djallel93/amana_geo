<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <?!= include('Google_app_script/assets/css/styles.html'); ?>
    <style>
        body {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        h2 {
            color: #fa709a;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🎯 Quartiers dans un rayon</h2>

        <div class="form-group">
            <label for="address">Adresse de référence</label>
            <input type="text" id="address" placeholder="Ex: 1 Place Bellecour, Lyon">
        </div>

        <div class="form-group">
            <label for="radius">Rayon de recherche (km)</label>
            <input type="number" id="radius" value="10" min="1" max="100" step="0.5">
        </div>

        <button class="btn-primary" style="width: 100%;" onclick="searchQuartiers()">🔍 Rechercher</button>

        <div id="results" class="results"></div>
    </div>

    <script>
        function searchQuartiers() {
            const address = document.getElementById('address').value;
            const radius = parseFloat(document.getElementById('radius').value);

            if (!address) {
                alert('⚠️ Veuillez saisir une adresse');
                return;
            }

            google.script.run
                .withSuccessHandler(showResults)
                .withFailureHandler(showError)
                .findQuartiersInRadiusUI(address, radius);
        }

        function showResults(data) {
            const div = document.getElementById('results');
            div.classList.add('show');

            if (data.quartiers.length === 0) {
                div.innerHTML = '<p class="text-center text-muted">Aucun quartier trouvé</p>';
                return;
            }

            let html = '<h3 style="color: #fa709a;">' + data.quartiers.length + ' quartier(s) trouvé(s)</h3>';
            html += '<p class="text-muted"><strong>Adresse:</strong> ' + data.address + '</p>';

            data.quartiers.forEach(function (q) {
                html += '<div class="card">' +
                    '<h4>' + q.quartierName + '</h4>' +
                    '<p>📏 Distance: ' + q.distance + ' km</p>' +
                    '<p>📍 Coordonnées: ' + q.quartierLatitude.toFixed(4) + ', ' + q.quartierLongitude.toFixed(4) + '</p>' +
                    '<p>🏢 Secteur ID: ' + q.idSecteur + '</p>' +
                    '</div>';
            });

            div.innerHTML = html;
        }

        function showError(error) {
            const div = document.getElementById('results');
            div.classList.add('show');
            div.innerHTML =
                '<div class="result-error">' +
                '<h3 style="margin-top: 0; color: #c62828;">❌ Erreur</h3>' +
                '<p>' + error + '</p>' +
                '</div>';
        }
    </script>
</body>

</html>

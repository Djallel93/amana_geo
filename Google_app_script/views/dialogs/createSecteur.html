<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <?!= include('assets/css/styles.html'); ?>
    <style>
        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        h2 {
            color: #fcb69f;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>📍 Créer un nouveau secteur</h2>

        <div class="info-box success">
            ℹ️ Les coordonnées sont optionnelles. Elles peuvent être calculées automatiquement à partir des quartiers.
        </div>

        <div class="form-group">
            <label for="ville" class="required">Ville</label>
            <select id="ville">
                <option value="">Sélectionner une ville...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nom" class="required">Nom du secteur</label>
            <select id="nom">
                <option value="Centre">Centre</option>
                <option value="Nord">Nord</option>
                <option value="Sud">Sud</option>
                <option value="Est">Est</option>
                <option value="Ouest">Ouest</option>
            </select>
        </div>

        <div class="form-group">
            <label for="latitude">Latitude (optionnel)</label>
            <input type="number" id="latitude" step="0.0001" placeholder="Ex: 47.2173">
        </div>

        <div class="form-group">
            <label for="longitude">Longitude (optionnel)</label>
            <input type="number" id="longitude" step="0.0001" placeholder="Ex: -1.5536">
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="google.script.host.close()">Annuler</button>
            <button class="btn-primary" onclick="createSecteur()">✅ Créer</button>
        </div>
    </div>

    <script>
        // Charger les villes
        google.script.run
            .withSuccessHandler(function (villes) {
                const select = document.getElementById('ville');
                villes.forEach(function (ville) {
                    const option = document.createElement('option');
                    option.value = ville.id;
                    option.textContent = ville.nom + ' (' + ville.codePostal + ')';
                    select.appendChild(option);
                });
            })
            .getAllVilles();

        function createSecteur() {
            const ville = document.getElementById('ville').value;
            const nom = document.getElementById('nom').value;
            const latitude = document.getElementById('latitude').value;
            const longitude = document.getElementById('longitude').value;

            if (!ville || !nom) {
                alert('⚠️ Les champs marqués d\'un * sont obligatoires');
                return;
            }

            google.script.run
                .withSuccessHandler(function (result) {
                    alert('✅ Secteur créé avec succès !\n\nID: ' + result.id + '\nNom: ' + result.nom);
                    google.script.host.close();
                })
                .withFailureHandler(function (error) {
                    alert('❌ Erreur: ' + error);
                })
                .createSecteurUI(nom, ville, latitude, longitude);
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <?!= include('assets/css/styles.html'); ?>
    <style>
        body {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        h2 {
            color: #4facfe;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🏙️ Créer une nouvelle ville</h2>

        <div class="form-group">
            <label for="nom" class="required">Nom de la ville</label>
            <input type="text" id="nom" placeholder="Ex: Nantes">
        </div>

        <div class="form-group">
            <label for="codePostal" class="required">Code postal</label>
            <input type="text" id="codePostal" placeholder="Ex: 44000">
        </div>

        <div class="form-group">
            <label for="departement">Département</label>
            <input type="text" id="departement" placeholder="Ex: Loire-Atlantique">
        </div>

        <div class="form-group">
            <label for="pays">Pays</label>
            <input type="text" id="pays" value="France">
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="google.script.host.close()">Annuler</button>
            <button class="btn-primary" onclick="createVille()">✅ Créer</button>
        </div>
    </div>

    <script>
        function createVille() {
            const nom = document.getElementById('nom').value.trim();
            const codePostal = document.getElementById('codePostal').value.trim();
            const departement = document.getElementById('departement').value.trim();
            const pays = document.getElementById('pays').value.trim();

            if (!nom || !codePostal) {
                alert('⚠️ Les champs marqués d\'un * sont obligatoires');
                return;
            }

            google.script.run
                .withSuccessHandler(function (result) {
                    alert('✅ Ville créée avec succès !\n\nID: ' + result.id + '\nNom: ' + result.nom);
                    google.script.host.close();
                })
                .withFailureHandler(function (error) {
                    alert('❌ Erreur: ' + error);
                })
                .createVilleUI(nom, codePostal, departement, pays);
        }
    </script>
</body>

</html>

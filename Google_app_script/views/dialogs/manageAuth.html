<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <?!= include('Google_app_script/assets/css/styles.html'); ?>
    <style>
        body {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        h2 {
            color: #f5576c;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #f5576c;
            border-bottom-color: #f5576c;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .token-item,
        .email-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #f5576c;
        }

        .token-item h4,
        .email-item h4 {
            margin: 0 0 10px 0;
            color: #333;
        }

        .token-item p,
        .email-item p {
            margin: 5px 0;
            font-size: 13px;
            color: #666;
        }

        .token-value {
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            word-break: break-all;
            border: 1px solid #e0e0e0;
        }

        .status-active {
            color: #4caf50;
            font-weight: 600;
        }

        .status-revoked {
            color: #f44336;
            font-weight: 600;
        }

        .btn-revoke {
            background: #f44336;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }

        .btn-delete {
            background: #ff9800;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            margin-left: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🔐 Gestion de l'authentification</h2>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('emails')">📧 Emails autorisés</button>
            <button class="tab" onclick="switchTab('tokens')">🔑 Tokens API</button>
            <button class="tab" onclick="switchTab('domains')">🌐 Domaines</button>
        </div>

        <!-- TAB: Emails -->
        <div id="tab-emails" class="tab-content active">
            <div class="info-box info">
                ℹ️ Les emails listés ici peuvent accéder à l'interface Google Sheets.
            </div>

            <div class="form-group">
                <label for="newEmail">Ajouter un email</label>
                <input type="email" id="newEmail" placeholder="utilisateur@example.com">
                <button class="btn-success btn-sm" onclick="addEmail()">➕ Ajouter</button>
            </div>

            <h3>Emails autorisés</h3>
            <div id="emailList" class="list-container"></div>
        </div>

        <!-- TAB: Tokens -->
        <div id="tab-tokens" class="tab-content">
            <div class="info-box info">
                ℹ️ Les tokens permettent aux applications externes d'appeler l'API REST.
            </div>

            <div class="form-group">
                <label for="tokenName">Nom du token</label>
                <input type="text" id="tokenName" placeholder="Ex: FAMILIES, Mobile App">
            </div>

            <div class="form-group">
                <label for="tokenExpiry">Validité (jours)</label>
                <input type="number" id="tokenExpiry" value="365" min="1" max="3650">
            </div>

            <button class="btn-success btn-sm" onclick="generateToken()">🔑 Générer un token</button>

            <h3>Tokens actifs</h3>
            <div id="tokenList" class="list-container"></div>
        </div>

        <!-- TAB: Domains -->
        <div id="tab-domains" class="tab-content">
            <div class="info-box info">
                ℹ️ Tous les emails de ces domaines seront autorisés (ex: amana.org).
            </div>

            <div class="form-group">
                <label for="newDomain">Ajouter un domaine</label>
                <input type="text" id="newDomain" placeholder="example.com">
                <button class="btn-success btn-sm" onclick="addDomain()">➕ Ajouter</button>
            </div>

            <h3>Domaines autorisés</h3>
            <div id="domainList" class="list-container"></div>
        </div>

        <div class="btn-group mt-30">
            <button class="btn-secondary" onclick="google.script.host.close()">Fermer</button>
            <button class="btn-primary" onclick="refreshAll()">🔄 Actualiser</button>
        </div>
    </div>

    <script>
        // Charger les données au démarrage
        window.onload = function () {
            loadEmails();
            loadTokens();
            loadDomains();
        };

        function switchTab(tabName) {
            // Désactiver tous les tabs
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

            // Activer le tab sélectionné
            document.querySelector(`.tab[onclick*="${tabName}"]`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // === EMAILS ===

        function loadEmails() {
            google.script.run
                .withSuccessHandler(function (emails) {
                    const list = document.getElementById('emailList');

                    if (emails.length === 0) {
                        list.innerHTML = '<div class="empty-state">Aucun email autorisé</div>';
                        return;
                    }

                    list.innerHTML = emails.map(email => `
              <div class="email-item">
                <h4>${email}</h4>
                <button class="btn-delete" onclick="removeEmail('${email}')">🗑️ Retirer</button>
              </div>
            `).join('');
                })
                .getAuthorizedEmails();
        }

        function addEmail() {
            const email = document.getElementById('newEmail').value.trim();

            if (!email) {
                alert('⚠️ Veuillez saisir un email');
                return;
            }

            google.script.run
                .withSuccessHandler(function (added) {
                    if (added) {
                        alert('✅ Email ajouté avec succès');
                        document.getElementById('newEmail').value = '';
                        loadEmails();
                    } else {
                        alert('ℹ️ Cet email est déjà dans la liste');
                    }
                })
                .withFailureHandler(function (error) {
                    alert('❌ Erreur: ' + error);
                })
                .addAuthorizedEmail(email);
        }

        function removeEmail(email) {
            if (!confirm(`Retirer ${email} de la liste ?`)) {
                return;
            }

            google.script.run
                .withSuccessHandler(function () {
                    alert('✅ Email retiré');
                    loadEmails();
                })
                .removeAuthorizedEmail(email);
        }

        // === TOKENS ===

        function loadTokens() {
            google.script.run
                .withSuccessHandler(function (tokens) {
                    const list = document.getElementById('tokenList');

                    if (tokens.length === 0) {
                        list.innerHTML = '<div class="empty-state">Aucun token créé</div>';
                        return;
                    }

                    list.innerHTML = tokens.map(token => {
                        const status = token.active ?
                            '<span class="status-active">✅ Actif</span>' :
                            '<span class="status-revoked">❌ Révoqué</span>';

                        const createdDate = new Date(token.createdAt).toLocaleDateString('fr-FR');
                        const expiryDate = new Date(token.expiresAt).toLocaleDateString('fr-FR');
                        const lastUsed = token.lastUsed ?
                            new Date(token.lastUsed).toLocaleDateString('fr-FR') :
                            'Jamais';

                        return `
                <div class="token-item">
                  <h4>${token.name} ${status}</h4>
                  <p><strong>Préfixe:</strong> ${token.tokenPrefix}</p>
                  <p><strong>Créé le:</strong> ${createdDate}</p>
                  <p><strong>Expire le:</strong> ${expiryDate}</p>
                  <p><strong>Dernière utilisation:</strong> ${lastUsed}</p>
                  <p><strong>Nombre d'utilisations:</strong> ${token.usageCount}</p>
                  ${token.active ? `<button class="btn-revoke" onclick="revokeToken('${token.tokenPrefix}')">🔒 Révoquer</button>` : ''}
                </div>
              `;
                    }).join('');
                })
                .listAPITokens();
        }

        function generateToken() {
            const name = document.getElementById('tokenName').value.trim();
            const expiry = parseInt(document.getElementById('tokenExpiry').value);

            if (!name) {
                alert('⚠️ Veuillez donner un nom au token');
                return;
            }

            google.script.run
                .withSuccessHandler(function (tokenData) {
                    alert('✅ Token généré avec succès !\n\n' +
                        '🔑 IMPORTANT: Copiez ce token, il ne sera plus affiché.\n\n' +
                        tokenData.token + '\n\n' +
                        'Nom: ' + tokenData.name + '\n' +
                        'Expire le: ' + new Date(tokenData.expiresAt).toLocaleDateString('fr-FR'));

                    document.getElementById('tokenName').value = '';
                    loadTokens();
                })
                .withFailureHandler(function (error) {
                    alert('❌ Erreur: ' + error);
                })
                .generateAPIToken(name, expiry);
        }

        function revokeToken(tokenPrefix) {
            if (!confirm('Révoquer ce token ? Il ne pourra plus être utilisé.')) {
                return;
            }

            // Note: On ne peut pas révoquer par préfixe, il faudrait stocker le token complet
            // Pour l'instant, rechargeons la liste
            alert('ℹ️ Fonctionnalité à implémenter: révocation par ID');
        }

        // === DOMAINS ===

        function loadDomains() {
            google.script.run
                .withSuccessHandler(function (domains) {
                    const list = document.getElementById('domainList');

                    if (domains.length === 0) {
                        list.innerHTML = '<div class="empty-state">Aucun domaine autorisé</div>';
                        return;
                    }

                    list.innerHTML = domains.map(domain => `
              <div class="email-item">
                <h4>*@${domain}</h4>
                <p>Tous les emails de ce domaine sont autorisés</p>
                <button class="btn-delete" onclick="removeDomain('${domain}')">🗑️ Retirer</button>
              </div>
            `).join('');
                })
                .getAuthorizedDomains();
        }

        function addDomain() {
            const domain = document.getElementById('newDomain').value.trim().toLowerCase();

            if (!domain) {
                alert('⚠️ Veuillez saisir un domaine');
                return;
            }

            // Retirer @ si présent
            const cleanDomain = domain.replace('@', '');

            google.script.run
                .withSuccessHandler(function (added) {
                    if (added) {
                        alert('✅ Domaine ajouté avec succès');
                        document.getElementById('newDomain').value = '';
                        loadDomains();
                    } else {
                        alert('ℹ️ Ce domaine est déjà dans la liste');
                    }
                })
                .withFailureHandler(function (error) {
                    alert('❌ Erreur: ' + error);
                })
                .addAuthorizedDomain(cleanDomain);
        }

        function removeDomain(domain) {
            if (!confirm(`Retirer le domaine ${domain} de la liste ?`)) {
                return;
            }

            google.script.run
                .withSuccessHandler(function () {
                    alert('✅ Domaine retiré');
                    loadDomains();
                })
                .removeAuthorizedDomain(domain);
        }

        function refreshAll() {
            loadEmails();
            loadTokens();
            loadDomains();
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <?!= include('Google_app_script/assets/css/styles.html'); ?>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        h2 {
            color: #667eea;
        }

        .result-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }

        .distance-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>📏 Calculer une distance</h2>

        <div class="form-group">
            <label for="lat1" class="required">Latitude point 1</label>
            <input type="number" id="lat1" step="0.0001" placeholder="48.8566" value="48.8566">
        </div>

        <div class="form-group">
            <label for="lng1" class="required">Longitude point 1</label>
            <input type="number" id="lng1" step="0.0001" placeholder="2.3522" value="2.3522">
        </div>

        <div class="form-group">
            <label for="lat2" class="required">Latitude point 2</label>
            <input type="number" id="lat2" step="0.0001" placeholder="47.2173" value="47.2173">
        </div>

        <div class="form-group">
            <label for="lng2" class="required">Longitude point 2</label>
            <input type="number" id="lng2" step="0.0001" placeholder="-1.5536" value="-1.5536">
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="google.script.host.close()">Annuler</button>
            <button class="btn-primary" onclick="calculateDistance()">📏 Calculer</button>
        </div>

        <div id="result" class="results"></div>
    </div>

    <script>
        function calculateDistance() {
            const lat1 = parseFloat(document.getElementById('lat1').value);
            const lng1 = parseFloat(document.getElementById('lng1').value);
            const lat2 = parseFloat(document.getElementById('lat2').value);
            const lng2 = parseFloat(document.getElementById('lng2').value);

            if (isNaN(lat1) || isNaN(lng1) || isNaN(lat2) || isNaN(lng2)) {
                alert('⚠️ Veuillez saisir des coordonnées valides');
                return;
            }

            google.script.run
                .withSuccessHandler(function (result) {
                    const div = document.getElementById('result');
                    div.classList.add('show');
                    div.innerHTML =
                        '<div class="result-success">' +
                        '<h3 style="margin-top: 0;">📏 Distance calculée</h3>' +
                        '<div class="distance-value">' + result.distance + ' km</div>' +
                        '<p><strong>De:</strong> ' + result.from.latitude + ', ' + result.from.longitude + '</p>' +
                        '<p><strong>À:</strong> ' + result.to.latitude + ', ' + result.to.longitude + '</p>' +
                        '<p style="margin-top: 20px; font-size: 12px; color: #999;">Calculé avec la formule de Haversine</p>' +
                        '</div>';
                })
                .withFailureHandler(function (error) {
                    const div = document.getElementById('result');
                    div.classList.add('show');
                    div.innerHTML =
                        '<div class="result-error">' +
                        '<h3 style="margin-top: 0;">❌ Erreur</h3>' +
                        '<p>' + error + '</p>' +
                        '</div>';
                })
                .calculateDistance(lat1, lng1, lat2, lng2);
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <?!= include('Google_app_script/assets/css/styles.html'); ?>
    <style>
        body {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        h2 {
            color: #fa709a;
        }

        .test-item {
            background: #f8f9fa;
            padding: 15px;

        }

        .test-item.success {

            border-left-color: #f44336;

        .test-result {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: white;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🧪 Tester l'API REST</h2>

        <div class="info-box info">
            ℹ️ Cette opération teste tous les endpoints principaux de l'API REST.
        </div>

        <button class="btn-primary" style="width: 100%;" onclick="runTests()">🚀 Lancer les tests</button>

        <div id="results" style="margin-top: 20px;"></div>
    </div>

    <script>
        function runTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p style="text-align: center;">⏳ Tests en cours...</p>';

            google.script.run
                .withSuccessHandler(function (results) {
                    displayResults(results);
                })
                .withFailureHandler(function (error) {
                    resultsDiv.innerHTML =
                        '<div class="test-item error">' +
                        '<h3 style="margin-top: 0;">❌ Erreur</h3>' +
                        '<p>' + error + '</p>' +
                        '</div>';
                })
                .runAPITests();
        }

        function displayResults(results) {
            const resultsDiv = document.getElementById('results');
            let html = '';

            results.forEach(function (test) {
                const cssClass = test.success ? 'success' : 'error';
                const icon = test.success ? '✅' : '❌';

                html += '<div class="test-item ' + cssClass + '">' +
                    '<h4 style="margin: 0 0 10px 0;">' + icon + ' ' + test.name + '</h4>' +
                    '<p style="margin: 0; color: ' + (test.success ? '#2e7d32' : '#c62828') + ';">' +
                    test.message + '</p>';

                if (test.details) {
                    html += '<div class="test-result">' +
                        JSON.stringify(test.details, null, 2) +
                        '</div>';
                }

                html += '</div>';
            });

            resultsDiv.innerHTML = html;
        }
    </script>
</body>

</html>

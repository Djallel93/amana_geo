<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <?!= include('Google_app_script/assets/css/styles.html'); ?>
    <style>
        body {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
        }

        h2 {
            color: #30cfd0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🏘️ Créer un nouveau quartier</h2>

        <div class="form-group">
            <label for="ville" class="required">Ville</label>
            <select id="ville" onchange="loadSecteurs()">
                <option value="">Sélectionner une ville...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="secteur" class="required">Secteur</label>
            <select id="secteur">
                <option value="">Sélectionner d'abord une ville...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nom" class="required">Nom du quartier</label>
            <input type="text" id="nom" placeholder="Ex: Centre-Ville, Bouffay...">
            <button class="btn-success btn-sm" onclick="geocodeFromName()">🔍 Géocoder automatiquement</button>
        </div>

        <div class="form-group">
            <label for="latitude" class="required">Latitude</label>
            <input type="number" id="latitude" step="0.0001" placeholder="Ex: 47.2173">
        </div>

        <div class="form-group">
            <label for="longitude" class="required">Longitude</label>
            <input type="number" id="longitude" step="0.0001" placeholder="Ex: -1.5536">
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="google.script.host.close()">Annuler</button>
            <button class="btn-primary" onclick="createQuartier()">✅ Créer</button>
        </div>
    </div>

    <script>
        let villesData = [];

        // Charger les villes
        google.script.run
            .withSuccessHandler(function (villes) {
                villesData = villes;
                const select = document.getElementById('ville');
                villes.forEach(function (ville) {
                    const option = document.createElement('option');
                    option.value = ville.id;
                    option.textContent = ville.nom + ' (' + ville.codePostal + ')';
                    select.appendChild(option);
                });
            })
            .getAllVilles();

        function loadSecteurs() {
            const villeId = document.getElementById('ville').value;
            const secteurSelect = document.getElementById('secteur');

            secteurSelect.innerHTML = '<option value="">Sélectionner un secteur...</option>';

            if (villeId) {
                google.script.run
                    .withSuccessHandler(function (secteurs) {
                        secteurs.forEach(function (secteur) {
                            const option = document.createElement('option');
                            option.value = secteur.id;
                            option.textContent = secteur.nom;
                            secteurSelect.appendChild(option);
                        });
                    })
                    .getSecteursByVille(villeId);
            }
        }

        function geocodeFromName() {
            const nom = document.getElementById('nom').value;
            const villeId = document.getElementById('ville').value;

            if (!nom || !villeId) {
                alert('⚠️ Veuillez remplir le nom et sélectionner une ville');
                return;
            }

            const ville = villesData.find(v => v.id == villeId);
            if (!ville) return;

            const address = nom + ', ' + ville.nom + ', ' + ville.codePostal + ', France';

            google.script.run
                .withSuccessHandler(function (result) {
                    if (result.isValid) {
                        document.getElementById('latitude').value = result.coordinates.latitude;
                        document.getElementById('longitude').value = result.coordinates.longitude;
                        alert('✅ Coordonnées trouvées !');
                    } else {
                        alert('❌ Impossible de géocoder cette adresse');
                    }
                })
                .geocodeAddress(address);
        }

        function createQuartier() {
            const nom = document.getElementById('nom').value;
            const secteur = document.getElementById('secteur').value;
            const latitude = document.getElementById('latitude').value;
            const longitude = document.getElementById('longitude').value;

            if (!nom || !secteur || !latitude || !longitude) {
                alert('⚠️ Tous les champs marqués d\'un * sont obligatoires');
                return;
            }

            google.script.run
                .withSuccessHandler(function (result) {
                    alert('✅ Quartier créé avec succès !\n\nID: ' + result.id + '\nNom: ' + result.nom);
                    google.script.host.close();
                })
                .withFailureHandler(function (error) {
                    alert('❌ Erreur: ' + error);
                })
                .createQuartierUI(nom, secteur, latitude, longitude);
        }
    </script>
</body>

</html>
